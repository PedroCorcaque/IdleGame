<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenhador Idle</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe8f7;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170f26}}
:root[data-theme="dark"]{--bg:#170f26}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:min(100vw,56.25vh);aspect-ratio:9/16;touch-action:none;display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=360,VH=640,WH=1000,F="'Lilita One',system-ui,sans-serif";
c.width=720;c.height=1280;x.scale(2,2);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let phase=0,msg='',msgT=0,idleT=0,t=0,money=0,earned=0,cap=8,dmg=1,wood=0,cam=360,fog=true,started=false,ended=false,noEnd=false,done=0,endT=0,sellT=0,installed=false;
const P={x:180,y:930,face:1,sw:0,hit:0},helpers=[],pops=[],coins=[],trees=[];
const HUT={x:180,y:575};
let pads=[
 {x:180,y:470,cost:40,l:'Nova floresta',f(){fog=false}},
 {x:90,y:790,cost:60,l:'Mochila maior',f(){cap+=8}},
 {x:270,y:790,cost:100,l:'Ajudante',f(){helpers.push({x:180,y:930,w:0,tg:null,q:0})}},
 {x:180,y:860,cost:150,l:'Machado forte',f(){dmg=2}}
];
pads.forEach(p=>{p.paid=0;p.done=false;p.pt=0});
const TH=[
{n:'Floresta',item:'Madeira',price:5,hut:'Vender',g:['#b9a3e3','#c4b0ea'],hc:'#8b5cf6',L:['Nova floresta','Mochila maior','Ajudante','Machado forte']},
{n:'Lago gelado',item:'Peixe',price:8,hut:'Iglu',g:['#ece6f8','#e0d8f3'],hc:'#a78bfa',L:['Novo lago','Balde maior','Pinguim ajudante','Vara forte']},
{n:'Berçário',item:'Ovo',price:12,hut:'Berçário',g:['#f6dcf7','#efcff2'],hc:'#d946ef',L:['Novo ninho','Cesto maior','Bebê pinguim','Luvas macias']}];
const END=[{t:'Sua serraria cresceu, amor!',s:'Os pinguins te esperam no gelo 🐧'},{t:'O lago ficou lindo!',s:'Os pinguins estão apaixonados por você, amor'},{t:'Você cuidou de todos!',s:'Fim da aventura, amor, mas pode continuar brincando 💛'}];
const CUTE=['Você é a melhor, amor 💜','Amor, você está indo lindamente','Os pinguins te adoram, amor 🐧','Respira fundo, amor. Você está arrasando','Um abraço apertado pra você, amor 🤗','Amor, você merece uma pausa e um chocolate 🍫','Cada sorriso seu deixa o dia melhor, amor ✨','Alguém aqui pensa em você com muito carinho, amor 💜','Que orgulho de você, amor!'];
const CUTE_OLD=['Você é demais! 💛','Os pinguins te adoram 🐧','Respira fundo, você está indo muito bem','Que dupla fofa: você e os pinguins','Um abraço virtual pra você 🤗','Você merece uma pausa e um chocolate 🍫','Cada passinho seu deixa o dia melhor ✨','Alguém pensa em você com carinho 💕'];
function toast(s){msg=s;msgT=4.5}
toast('Oi, amor! Vamos colher madeira juntinhos? 🌲');
function startPhase(n){phase=n;const L=TH[n].L;wood=0;cap=8;dmg=1;helpers.length=0;fog=true;done=0;endT=0;ended=false;noEnd=false;trees.length=0;
 pads=[{x:180,y:470,cost:40,l:L[0],f(){fog=false}},{x:90,y:790,cost:60,l:L[1],f(){cap+=8}},{x:270,y:790,cost:100,l:L[2],f(){helpers.push({x:180,y:930,w:0,tg:null,q:0})}},{x:180,y:860,cost:150,l:L[3],f(){dmg=2}}];
 pads.forEach(p=>{p.paid=0;p.done=false;p.pt=0});plant(11,640,980);plant(18,90,400);trees.sort((a,b)=>a.y-b.y);P.x=180;P.y=930;cam=360;toast('Fase '+(n+1)+': '+TH[n].n+' 🐧')}
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function plant(n,y0,y1){let k=0;while(n>0&&k++<900){const px=28+rnd()*304,py=y0+rnd()*(y1-y0);
 if(trees.every(q=>Math.hypot(q.x-px,q.y-py)>50)&&pads.every(p=>Math.hypot(p.x-px,p.y-py)>62)&&Math.hypot(px-HUT.x,py-HUT.y)>80&&Math.hypot(px-180,py-930)>60){trees.push({x:px,y:py,hp:3,max:3,r:0,sh:0});n--}}}
plant(11,640,980);plant(18,90,400);trees.sort((a,b)=>a.y-b.y);

// input
const joy={on:false,ox:0,oy:0,dx:0,dy:0},key={x:0,y:0,l:0,r:0,u:0,d:0};
let AC=null;
function beep(f){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.12);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.12)}catch(e){}}
const lp=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*VH]};
c.addEventListener('pointerdown',e=>{
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}
 const[px,py]=lp(e);
 if(ended&&!noEnd){
  if(px>50&&px<310&&py>380&&py<440){beep(880);if(phase<2)startPhase(phase+1);else{noEnd=true;ended=false}}

  return}
 started=true;joy.on=true;joy.ox=px;joy.oy=py;joy.dx=joy.dy=0;c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!joy.on)return;const[px,py]=lp(e);joy.dx=(px-joy.ox)/36;joy.dy=(py-joy.oy)/36;
 const m=Math.hypot(joy.dx,joy.dy);if(m>1){joy.dx/=m;joy.dy/=m;joy.ox=px-joy.dx*36;joy.oy=py-joy.dy*36}});
const up=()=>{joy.on=false;joy.dx=joy.dy=0};
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
const km={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'};
addEventListener('keydown',e=>{if(km[e.key]){key[km[e.key]]=1;started=true}});
addEventListener('keyup',e=>{if(km[e.key])key[km[e.key]]=0});

// logic
function nearTree(px,py,R){let b=null,bd=R;for(const q of trees){if(q.hp<=0||q.y<(fog?440:0))continue;const d=Math.hypot(q.x-px,q.y-py);if(d<bd){bd=d;b=q}}return b}
function hit(q,d){q.hp-=d;q.sh=.2;if(q.hp<=0){q.r=7;return true}return false}
function go(o,tx,ty,dt,s){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);if(d>1){const m=Math.min(d,s*dt);o.x+=dx/d*m;o.y+=dy/d*m}return d}
function addMoney(a,wx,wy){money+=a;earned+=a;for(let i=0;i<Math.min(3,a/5);i++)coins.push({x:wx+(rnd()-.5)*20,y:wy-cam-10,t:-i*.06});beep(520+Math.min(earned,400));}
function upd(dt){
 t+=dt;msgT-=dt;idleT+=dt;if(idleT>26&&started){idleT=0;toast(CUTE[Math.floor(rnd()*CUTE.length)])}
 let ax=key.r-key.l,ay=key.d-key.u;if(joy.on){ax=joy.dx;ay=joy.dy}
 const m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m}
 P.x=clamp(P.x+ax*125*dt,14,346);P.y=clamp(P.y+ay*125*dt,fog?445:20,WH-20);if(Math.abs(ax)>.1)P.face=ax>0?1:-1;
 P.sw=Math.max(0,P.sw-dt);P.hit-=dt;
 const tr=nearTree(P.x,P.y,40);
 if(tr&&wood<cap&&P.hit<=0){P.hit=.45;P.sw=.25;if(hit(tr,dmg)){wood++;pops.push({x:tr.x,y:tr.y-30,t:0,s:'+1'})}}
 if(Math.hypot(P.x-HUT.x,P.y-HUT.y)<50&&wood>0){sellT-=dt;if(sellT<=0){sellT=.07;wood--;addMoney(TH[phase].price,P.x,P.y)}}
 for(const p of pads){if(p.done)continue;
  if(Math.hypot(P.x-p.x,P.y-p.y)<38&&money>0){p.pt-=dt;if(p.pt<=0){p.pt=.04;const a=Math.min(money,Math.ceil(p.cost/22));money-=a;p.paid+=a;beep(300+p.paid*2);
   if(p.paid>=p.cost){p.done=true;p.f();done++;pops.push({x:p.x,y:p.y-20,t:0,s:p.l+'!'});beep(988);toast(CUTE[(done*3+phase)%CUTE.length]);if(done===4)endT=1.4}}}}
 for(const q of trees){q.sh=Math.max(0,q.sh-dt);if(q.hp<=0){q.r-=dt;if(q.r<=0)q.hp=q.max}}
 for(const h of helpers){
  if(h.w>=3){if(go(h,HUT.x,HUT.y,dt,85)<22){addMoney(h.w*TH[phase].price,h.x,h.y);h.w=0;h.tg=null}}
  else{if(!h.tg||h.tg.hp<=0)h.tg=nearTree(h.x,h.y,9999);
   if(h.tg&&go(h,h.tg.x,h.tg.y+16,dt,85)<22){h.q-=dt;if(h.q<=0){h.q=.7;if(hit(h.tg,1))h.w++}}}}
 for(const p of pops)p.t+=dt;for(let i=pops.length-1;i>=0;i--)if(pops[i].t>1)pops.splice(i,1);
 for(const k of coins)k.t+=dt*2;for(let i=coins.length-1;i>=0;i--)if(coins[i].t>=1)coins.splice(i,1);
 if(endT>0){endT-=dt;if(endT<=0&&!noEnd)ended=true}
 cam+=(clamp(P.y-420,0,WH-VH)-cam)*Math.min(1,dt*6);
}

// drawing
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function drawPenguin(h){x.fillStyle='rgba(0,0,0,.15)';x.beginPath();x.ellipse(h.x,h.y+13,11,4,0,0,7);x.fill();x.fillStyle='#2b3342';x.beginPath();x.ellipse(h.x,h.y,10,14+Math.sin(t*10)*.8,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(h.x,h.y+3,6,9,0,0,7);x.fill();x.fillStyle='#ffb347';x.beginPath();x.moveTo(h.x-3,h.y-5);x.lineTo(h.x+3,h.y-5);x.lineTo(h.x,h.y-1);x.fill();x.fillStyle='#fff';x.fillRect(h.x-4,h.y-9,2,2);x.fillRect(h.x+2,h.y-9,2,2);for(let i=0;i<h.w;i++){x.fillStyle=phase===1?'#ff9a4d':'#fffaf0';x.beginPath();x.arc(h.x-6+i*6,h.y-20,3,0,7);x.fill()}}
function drawNode(q){const s=q.sh>0?Math.sin(t*60)*2:0;
 if(phase===1){x.fillStyle='#7e5bc9';x.beginPath();x.ellipse(q.x,q.y+6,20,10,0,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
  if(q.hp>0){x.fillStyle='#ff9a4d';x.beginPath();x.ellipse(q.x+s,q.y-4+Math.sin(t*3+q.x)*3,10,5,0,0,7);x.fill();x.beginPath();x.moveTo(q.x+8+s,q.y-4);x.lineTo(q.x+15+s,q.y-9);x.lineTo(q.x+15+s,q.y+1);x.fill()}}
 else{x.fillStyle='#b98d5a';x.beginPath();x.ellipse(q.x,q.y+8,20,9,0,0,7);x.fill();
  if(q.hp>0){x.fillStyle='#fffaf0';x.beginPath();x.ellipse(q.x+s,q.y-2,9,12,0,0,7);x.fill();x.fillStyle='#f3a5c4';x.beginPath();x.arc(q.x+s-2,q.y-3,2.5,0,7);x.arc(q.x+s+3,q.y+2,2,0,7);x.fill()}}
 if(q.hp>0&&q.hp<q.max){x.fillStyle='rgba(0,0,0,.4)';rr(q.x-14,q.y-26,28,5,2);x.fill();x.fillStyle='#ffd54a';rr(q.x-14,q.y-26,28*q.hp/q.max,5,2);x.fill()}}
function drawTree(q){if(phase)return drawNode(q);
 if(q.hp<=0){x.fillStyle='#7a5230';x.beginPath();x.ellipse(q.x,q.y+10,8,4,0,0,7);x.fill();return}
 const s=q.sh>0?Math.sin(t*60)*2.5:0;
 x.fillStyle='rgba(0,0,0,.14)';x.beginPath();x.ellipse(q.x,q.y+12,16,6,0,0,7);x.fill();
 x.fillStyle='#8a5a32';x.fillRect(q.x-4,q.y-6,8,18);
 x.fillStyle='#7a4fc4';x.beginPath();x.arc(q.x+s,q.y-20,19,0,7);x.fill();
 x.fillStyle='#9b72e0';x.beginPath();x.arc(q.x+s-5,q.y-26,10,0,7);x.fill();
 if(q.hp<q.max){x.fillStyle='rgba(0,0,0,.4)';rr(q.x-14,q.y-46,28,5,2);x.fill();x.fillStyle='#ffd54a';rr(q.x-14,q.y-46,28*q.hp/q.max,5,2);x.fill()}
}
function drawPerson(o,col,carry,face,sw){
 x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(o.x,o.y+13,12,5,0,0,7);x.fill();
 const n=Math.min(carry,16);
 for(let i=0;i<n;i++){const col2=i>=8?1:0;x.fillStyle=phase===1?(i%2?'#ff9a4d':'#ffb877'):phase===2?(i%2?'#fffaf0':'#f6e7ef'):(i%2?'#b07a45':'#c48a52');x.fillRect(o.x-face*(15+col2*8)-6,o.y+4-(i%8)*5,12,4.5)}
 x.fillStyle=col;rr(o.x-9,o.y-8,18,22,6);x.fill();
 x.fillStyle='#f3c59b';x.beginPath();x.arc(o.x,o.y-14,8,0,7);x.fill();
 x.fillStyle='#6d28d9';x.beginPath();x.arc(o.x,o.y-17,8,Math.PI,0);x.fill();
 if(sw!==undefined){const a=sw>0?-1.2+(.25-sw)*10:-.4;x.strokeStyle='#6b4a2b';x.lineWidth=3;x.beginPath();x.moveTo(o.x+face*8,o.y);x.lineTo(o.x+face*(8+Math.cos(a)*18),o.y+Math.sin(a)*18);x.stroke();
  x.fillStyle='#cfd6dc';x.fillRect(o.x+face*(8+Math.cos(a)*18)-4,o.y+Math.sin(a)*18-4,8,8)}
}
function draw(){
 x.clearRect(0,0,W,VH);
 x.save();x.translate(0,-Math.round(cam));
 for(let y=0;y<WH;y+=80){x.fillStyle=(y/80)%2?TH[phase].g[0]:TH[phase].g[1];x.fillRect(0,y,W,80)}
 x.fillStyle=phase?'#d6c8ef':'#e6d4f5';rr(150,490,60,420,24);x.fill();
 // vender
 x.setLineDash([6,6]);x.strokeStyle='#c084fc';x.lineWidth=3;x.beginPath();x.arc(HUT.x,HUT.y,46,0,7);x.stroke();x.setLineDash([]);
 x.fillStyle=phase?'#f4f8fb':'#a66a3a';x.fillRect(145,500,70,34);x.fillStyle=TH[phase].hc;x.beginPath();x.moveTo(138,502);x.lineTo(180,474);x.lineTo(222,502);x.fill();
 x.fillStyle=phase?'#345':'#fff';x.font='13px '+F;x.textAlign='center';x.fillText(TH[phase].hut,180,523);
 // pads
 for(const p of pads){if(p.done)continue;
  x.fillStyle='rgba(255,255,255,.4)';rr(p.x-30,p.y-22,60,44,10);x.fill();
  const f=p.paid/p.cost;x.fillStyle='#c084fc';rr(p.x-30,p.y-22+44*(1-f),60,44*f,10);x.save();x.beginPath();x.roundRect(p.x-30,p.y-22,60,44,10);x.clip();x.fillRect(p.x-30,p.y-22+44*(1-f),60,44*f);x.restore();
  x.strokeStyle='#fff';x.lineWidth=3;rr(p.x-30,p.y-22,60,44,10);x.stroke();
  x.fillStyle='#fff';x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=3;x.font='15px '+F;x.textAlign='center';
  x.strokeText('$'+(p.cost-p.paid),p.x,p.y+5);x.fillText('$'+(p.cost-p.paid),p.x,p.y+5);
  x.font='12px '+F;x.strokeText(p.l,p.x,p.y-28);x.fillText(p.l,p.x,p.y-28)}
 // entidades por profundidade
 const ents=trees.map(q=>({y:q.y,d:()=>drawTree(q)}));
 ents.push({y:P.y,d:()=>drawPerson(P,'#a855f7',wood,P.face,P.sw)});
 for(const h of helpers)ents.push({y:h.y,d:()=>phase?drawPenguin(h):drawPerson(h,'#e879b9',h.w,1)});
 ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d());
 if(wood>=cap){x.fillStyle='#fff';x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=3;x.font='14px '+F;x.strokeText('Cheio! Vá vender',P.x,P.y-40);x.fillText('Cheio! Vá vender',P.x,P.y-40)}
 // névoa
 if(fog){const g=x.createLinearGradient(0,380,0,432);g.addColorStop(0,'rgba(24,46,34,.96)');g.addColorStop(1,'rgba(24,46,34,.96)');x.fillStyle=phase?'#b8a6dc':'#2a1a4a';x.fillRect(0,0,W,420);
  x.fillStyle=phase?'rgba(184,166,220,.9)':'rgba(42,26,74,.9)';x.fillRect(0,420,W,18);x.fillStyle='#4f7d62';x.font='46px '+F;x.textAlign='center';x.fillText('?',180,250)}
 for(const p of pops){x.globalAlpha=1-p.t;x.fillStyle='#fff';x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=3;x.font='16px '+F;x.textAlign='center';x.strokeText(p.s,p.x,p.y-p.t*30);x.fillText(p.s,p.x,p.y-p.t*30);x.globalAlpha=1}
 x.restore();
 // coins voando pro HUD
 for(const k of coins){if(k.t<0)continue;const e=k.t*k.t,cx=k.x+(150-k.x)*e,cy=k.y+(30-k.y)*e;x.fillStyle='#ffc933';x.strokeStyle='#b8860b';x.lineWidth=2;x.beginPath();x.arc(cx,cy,6,0,7);x.fill();x.stroke()}
 // HUD
 x.fillStyle='rgba(0,0,0,.45)';rr(110,12,140,36,18);x.fill();
 x.fillStyle='#ffc933';x.beginPath();x.arc(132,30,10,0,7);x.fill();x.fillStyle='#b8860b';x.font='14px '+F;x.textAlign='center';x.fillText('$',132,35);
 x.fillStyle='#fff';x.textAlign='left';x.font='22px '+F;x.fillText(money,150,38);
 x.fillStyle='rgba(0,0,0,.45)';rr(130,54,100,16,8);x.fill();x.fillStyle='#c48a52';rr(130,54,Math.max(10,100*wood/cap),16,8);x.fill();
 x.fillStyle='#fff';x.font='11px '+F;x.textAlign='center';x.fillText(TH[phase].item+' '+wood+'/'+cap,180,66);
 // dica
 if(!started){x.fillStyle='rgba(0,0,0,.5)';rr(70,540,220,46,23);x.fill();x.fillStyle='#fff';x.font='18px '+F;x.textAlign='center';x.fillText('Arraste para mover',180,570);
  const hx=180+Math.sin(t*3)*40;x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(hx,500,16,0,7);x.fill()}
 // joystick
 if(joy.on){x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=3;x.beginPath();x.arc(joy.ox,joy.oy,36,0,7);x.stroke();x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.arc(joy.ox+joy.dx*36,joy.oy+joy.dy*36,14,0,7);x.fill()}
 if(msgT>0){x.globalAlpha=Math.min(1,msgT);x.font='15px '+F;const mw=x.measureText(msg).width+36;x.fillStyle='rgba(255,255,255,.92)';rr(180-mw/2,84,mw,34,17);x.fill();x.fillStyle='#7c3aed';x.textAlign='center';x.fillText(msg,180,106);x.globalAlpha=1}
 // final
 if(ended&&!noEnd){
  x.fillStyle='rgba(10,20,14,.78)';x.fillRect(0,0,W,VH);
  x.fillStyle='#fff';x.textAlign='center';x.font='32px '+F;x.fillText(END[phase].t,180,250);
  x.font='18px '+F;x.fillStyle='#ffd54a';x.fillText('Você já ganhou $'+earned,180,290);
  x.fillStyle='#fff';x.font='15px '+F;x.fillText(END[phase].s,180,330);
  const pulse=1+Math.sin(t*6)*.03;x.save();x.translate(180,410);x.scale(pulse,pulse);
  x.fillStyle='#8b5cf6';rr(-130,-30,260,60,30);x.fill();x.fillStyle='#fff';x.font='24px '+F;x.fillText(phase<2?'Próxima fase':'Continuar jogando',0,8);x.restore()}
}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loop)})(last);
</script></body></html>
